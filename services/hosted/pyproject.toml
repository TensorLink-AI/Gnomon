[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gnomon-hosted"
version = "0.1.0"
description = "Self-hosted project evidence and remote MCP for Gnomon"
requires-python = ">=3.11"
dependencies = ["gnomon-forecast==1.3.1.dev0", "mcp==1.30.0", "uvicorn>=0.35,<1", "httpx>=0.28,<1", "jsonschema>=4.23,<5"]

[project.scripts]
gnomon-hosted = "gnomon_hosted.cli:main"
gnomon-shared = "gnomon_hosted.client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gnomon_hosted"]

[tool.pytest.ini_options]
testpaths = ["tests"]
