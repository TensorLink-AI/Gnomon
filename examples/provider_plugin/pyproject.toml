[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gnomon-example-provider"
version = "0.0.0"
description = "Local, dependency-free Gnomon provider extension example"
requires-python = ">=3.11"
dependencies = ["gnomon-forecast>=0.9.0.dev0,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/gnomon_example_provider"]
