[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aion-forecast"
version = "0.4.0"
description = "A local-first, evidence-backed forecasting runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Cascade"}]
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
excel = ["openpyxl>=3.1"]
dev = ["build>=1.2", "pytest>=8", "pyyaml>=6.0"]

# TSFM adapters — Aion works without any of these (missing deps = soft skip).
# TSFM packages have conflicting transitive dependencies (e.g. numpy pinning),
# so they are NOT declared as optional extras here. Install them separately:
#
#   pip install chronos-forecasting torch      # Amazon Chronos-Bolt (mini 21M, small 48M)
#   pip install toto-models torch              # Datadog Toto-2.0-22m (22M)
#   pip install uni2ts torch                   # Salesforce Moirai-2.0-R-Small (~14M)
#   pip install momentfm torch                 # CMU MOMENT-1-Small (~38M)
#   pip install "git+https://github.com/ibm-granite/granite-tsfm.git" torch  # IBM FlowState (18.5M) + TTM (1-3M)
#
# After installing any of the above, `aion capabilities` will list them under models.tsfm.

[project.scripts]
aion = "aion.cli:main"

[project.urls]
Homepage = "https://github.com/TensorLink-AI/Aion"
Documentation = "https://github.com/TensorLink-AI/Aion/tree/main/docs"
Repository = "https://github.com/TensorLink-AI/Aion"
Issues = "https://github.com/TensorLink-AI/Aion/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
