[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gnomon-forecast"
version = "0.5.0"
description = "A local-first trusted temporal execution runtime for agents"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Cascade"}]
dependencies = []
keywords = ["time-series", "forecasting", "agents", "mcp", "temporal-reasoning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
excel = ["openpyxl>=3.1"]
dev = ["build>=1.2", "pytest>=8", "pyyaml>=6.0"]

# TSFM adapters — Gnomon works without any of these (missing deps = soft skip).
# TSFM packages have conflicting transitive dependencies (e.g. numpy pinning),
# so they are NOT declared as optional extras here. Install them separately:
#
#   pip install chronos-forecasting torch      # Amazon Chronos-Bolt (mini 21M, small 48M)
#   pip install toto-models torch              # Datadog Toto-2.0-22m (22M)
#   pip install uni2ts torch                   # Salesforce Moirai-2.0-R-Small (~14M)
#   pip install momentfm torch                 # CMU MOMENT-1-Small (~38M)
#   pip install "git+https://github.com/ibm-granite/granite-tsfm.git" torch  # IBM FlowState (18.5M) + TTM (1-3M)
#
# After installing any of the above, `gnomon capabilities` will list them under models.tsfm.

[project.scripts]
gnomon = "gnomon.cli:main"

[project.urls]
Homepage = "https://github.com/TensorLink-AI/Gnomon"
Documentation = "https://github.com/TensorLink-AI/Gnomon/tree/main/docs"
Repository = "https://github.com/TensorLink-AI/Gnomon"
Issues = "https://github.com/TensorLink-AI/Gnomon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gnomon"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/tests"]
pythonpath = ["src"]
