[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "headwater-forecast"
version = "0.1.0"
description = "A local-first, evidence-backed forecasting runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Cascade"}]
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
dev = ["pytest>=8"]

[project.scripts]
headwater = "headwater.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/headwater"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

