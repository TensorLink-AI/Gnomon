[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gnomon-forecast"
dynamic = ["version"]
description = "Provider-neutral time-series execution and temporal evidence for agents"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Cascade"}]
dependencies = []
keywords = ["time-series", "forecasting", "agents", "mcp", "temporal-reasoning"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
excel = ["openpyxl>=3.1"]
dev = ["build>=1.2", "pytest>=8", "pyyaml>=6.0", "ruff>=0.12,<1"]
# One extra per adapter kind. The core package stays dependency-free; an
# adapter imports its package only when a provider of that kind is configured.
statsforecast = ["statsforecast>=2.0", "pandas>=2.0"]
statsmodels = ["statsmodels>=0.14"]
prophet = ["prophet>=1.1", "pandas>=2.0"]
mlforecast = ["mlforecast>=1.0", "lightgbm>=4.0", "pandas>=2.0"]
skforecast = ["skforecast>=0.14", "scikit-learn>=1.3", "pandas>=2.0"]
sktime = ["sktime>=0.30", "pandas>=2.0"]
darts = ["darts>=0.30", "pandas>=2.0"]
gluonts = ["gluonts>=0.15", "pandas>=2.0"]
neuralforecast = ["neuralforecast>=2.0", "torch>=2.2", "pandas>=2.0"]
adapters = ["gnomon-forecast[statsforecast,statsmodels,prophet,mlforecast,skforecast,sktime,darts,gluonts]"]


[project.scripts]
gnomon = "gnomon.cli:main"

[project.urls]
Homepage = "https://github.com/TensorLink-AI/Gnomon"
Documentation = "https://github.com/TensorLink-AI/Gnomon/tree/main/docs"
Repository = "https://github.com/TensorLink-AI/Gnomon"
Issues = "https://github.com/TensorLink-AI/Gnomon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gnomon"]

[tool.hatch.version]
path = "src/gnomon/product_contract.py"

[tool.hatch.build.hooks.custom]
path = "build_hook.py"

[tool.hatch.build.targets.wheel.shared-data]
"skills/use-gnomon" = "share/gnomon/skills/use-gnomon"

[tool.hatch.build.targets.sdist]
include = [
  "/src/gnomon",
  "/skills/use-gnomon",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/pyproject.toml",
  "/build_hook.py",
]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Keep this guard deliberately narrow: undefined names, unused imports/local
# bindings, and duplicate literal dictionary keys are correctness or hygiene
# defects rather than a repository-wide style policy.
select = ["F401", "F601", "F821", "F841"]
