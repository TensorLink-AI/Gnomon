[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aion-forecast"
version = "0.2.0"
description = "A local-first, evidence-backed forecasting runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Cascade"}]
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
dev = ["build>=1.2", "pytest>=8"]

[project.scripts]
aion = "aion.cli:main"

[project.urls]
Homepage = "https://github.com/TensorLink-AI/Aion"
Documentation = "https://github.com/TensorLink-AI/Aion/tree/main/docs"
Repository = "https://github.com/TensorLink-AI/Aion"
Issues = "https://github.com/TensorLink-AI/Aion/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
