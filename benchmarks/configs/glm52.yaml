# Full suite under one model: GLM-5.2 via OpenRouter.
#
#   python -m benchmarks.run_all --config benchmarks/configs/glm52.yaml --dry-run
#   python -m benchmarks.run_all --config benchmarks/configs/glm52.yaml \
#       --only tb-control,tb-aion
#
# Every run below is served by `model` — including AnomLLM, whose CLI
# names the flag --control-model. Each benchmark pairs a control (the
# model answering the official prompt alone) against the Aion condition
# (the same model, but every number computed by Aion), so
# `aion eval compare` has a like-for-like baseline.
#
# Prerequisites per benchmark are in each adapter's README; the two
# Hugging Face datasets are fetched with the adapter's own --download.

model: z-ai/glm-5.2
output_root: results/glm52
defaults:
  limit: 50
  temperature: 0.2

runs:
  # --- TemporalBench (HF: Melady/TemporalBench, --download) -----------
  - benchmark: temporalbench
    name: tb-control
    args:
      condition: control
      data_dir: ~/temporalbench
      tiers: T2,T4
  - benchmark: temporalbench
    name: tb-aion
    args:
      condition: aion-agent
      data_dir: ~/temporalbench
      tiers: T2,T4

  # --- TimeSage-MT (HF: Timesage/TimeSage-MT, --download) -------------
  # No `judge_model`: mechanical specs score identically in both
  # conditions and judge-based turns stay `unscored`, which keeps the
  # control/Aion comparison clean and avoids the model judging itself.
  - benchmark: timesage_mt
    name: ts-direct
    args:
      condition: direct
      data_dir: ~/timesage-mt
      tiers: L1,L2,L3,L4
  - benchmark: timesage_mt
    name: ts-aion
    args:
      condition: aion-tools
      data_dir: ~/timesage-mt
      tiers: L1,L2,L3,L4

  # --- CiK (pip install the official cik_benchmark package) -----------
  # No task cap: cost scales with seeds x tasks. `seeds: 1` is a smoke
  # pass; the official protocol is 5.
  - benchmark: cik
    name: cik-control
    args:
      method: control
      seeds: 1
  - benchmark: cik
    name: cik-aion
    args:
      method: aion-agent
      seeds: 1

  # --- MTBench (git clone Graph-and-Geometric-Learning/MTBench) -------
  # `control` wraps an official script unchanged and manages its own
  # outputs; `aion` takes the shared output dir and limit.
  - benchmark: mtbench
    name: mtb-control
    args:
      subcommand: control
      mtbench_root: ~/MTBench
      script: evaluation/finance/value_prediction.py
  - benchmark: mtbench
    name: mtb-aion
    args:
      subcommand: aion
      mtbench_root: ~/MTBench
      dataset_folder: ~/MTBench/data/processed/finance/aligned_in30days_out7days
      mode: agent

  # --- AnomLLM (git clone rose-stl-lab/AnomLLM; needs credentials.yml
  #     in the checkout for the control condition) --------------------
  # One invocation runs the Aion condition and the LLM control into the
  # official results tree, scored by the official src/result_agg.py.
  - benchmark: anomllm
    name: anomllm-trend
    args:
      anomllm_root: ~/AnomLLM
      data: trend
      control_variant: 0shot-text
