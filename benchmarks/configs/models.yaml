# OpenRouter model roster for AionBench.
#
# Slugs move: providers rename, retire, and re-tier models constantly. Verify
# before spending anything —
#
#   aionbench models --roster benchmarks/configs/models.yaml
#
# which prints exactly which of these OpenRouter still serves and exits
# non-zero if any are missing. Then run with a group or the whole file:
#
#   aionbench run --suite timeseriesexam --models @benchmarks/configs/models.yaml
#
# Groups are for humans; the loader flattens them and de-duplicates in order.

models:
  # --- closed-weight frontier ------------------------------------------
  frontier_closed:
    - anthropic/claude-opus-4.1
    - anthropic/claude-sonnet-4.5
    - openai/gpt-5
    - google/gemini-2.5-pro
    - x-ai/grok-4

  # --- open-weight frontier --------------------------------------------
  frontier_open:
    - deepseek/deepseek-r1
    - qwen/qwen3-235b-a22b
    - moonshotai/kimi-k2
    - z-ai/glm-4.6
    - openai/gpt-oss-120b

  # --- cheap tier, for smoke runs and prompt iteration -----------------
  # Run the full grid here first. A wiring bug is much cheaper to find at
  # this tier, and the failure taxonomy in the report is just as legible.
  economy:
    - anthropic/claude-haiku-4.5
    - openai/gpt-5-mini
    - google/gemini-2.5-flash
    - meta-llama/llama-4-maverick
    - mistralai/mistral-small-3.2-24b-instruct
