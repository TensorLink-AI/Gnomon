# Copy to the root of your AnomLLM checkout as credentials.yml.
#
# AnomLLM's official runner is OpenAI-compatible and keys this file by the
# exact --model string. Pointing base_url at OpenRouter lets any OpenRouter
# model serve as the control condition with zero changes to the official
# code. Add one entry per model you want to run.

openai/gpt-4o-mini:
  api_key: sk-or-...your-openrouter-key...
  base_url: https://openrouter.ai/api/v1

openai/gpt-4o:
  api_key: sk-or-...your-openrouter-key...
  base_url: https://openrouter.ai/api/v1

anthropic/claude-sonnet-4:
  api_key: sk-or-...your-openrouter-key...
  base_url: https://openrouter.ai/api/v1
