# Root-level Hermes plugin manifest so `hermes plugins install
# https://github.com/TensorLink-AI/Aion.git` discovers the plugin directly;
# the implementation lives in integrations/hermes/ and is re-exported by the
# root __init__.py.
name: aion
version: 0.3.0
description: "Evidence-backed local forecasting via the Aion CLI. Aion is authoritative for all numbers, intervals, model selection, and abstention; the agent formulates the question and explains the evidence."
author: "TensorLink"
kind: standalone
provides_tools:
  - aion_capabilities
  - aion_inspect
  - aion_forecast
  - aion_covariate_guide
  - aion_validate_covariates
  - aion_propose_covariates
  - aion_propose_context_events
  - aion_submit_actuals
  - aion_list_open_forecasts
  - aion_model_performance
  - aion_record_decision
  - aion_resolve_decision
  - aion_investigate_change
  - aion_decide
  - aion_monitor
