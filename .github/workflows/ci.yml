name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Validate benchmark configs
        # The adapters' own tests run above (testpaths includes
        # benchmarks/tests); this additionally proves every shipped config
        # still expands to a runnable command line, which is where the
        # suite silently rots — no datasets, no API keys, no LLM calls.
        run: |
          python -m pip install pyyaml
          for config in benchmarks/configs/*.yaml; do
            # Skip reference data (published_reference.yaml) — only
            # configs that declare runs describe a batch to validate.
            grep -q '^runs:' "$config" || continue
            echo "== $config"
            python -m benchmarks.run_all --config "$config" --dry-run
          done

  package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install --upgrade build
      - name: Lint Bash installer
        run: shellcheck install.sh
      - name: Build distributions
        run: python -m build
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Smoke-test installed CLI
        run: |
          cd "$(mktemp -d)"
          aion capabilities
          aion --version
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
