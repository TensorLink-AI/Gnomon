name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Check proven code-hygiene defects
        run: ruff check src/gnomon
      - name: Run production regressions
        run: pytest -q tests
      - name: Compile source
        run: python -m compileall -q src tests

  evaluation-harness:
    name: Current evaluation harness (no paid runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install harness test dependencies
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Check matched runner and scoring contracts
        run: pytest -q benchmarks/tests

  ordinary-software:
    name: Ordinary agent software isolation (no paid model calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install harness test dependencies
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Build the separate hash-locked software environment
        run: docker build --pull=false -t gnomon-bench-software:ci benchmarks/workflow/software
      - name: Build the isolated current Gnomon MCP service
        run: |
          python -m pip install build
          python -m build --wheel --outdir service-wheel
          docker build --pull=false --build-context ordinary-lock=benchmarks/workflow/software \
            --build-context core-wheel=service-wheel -t gnomon-bench-service:ci benchmarks/workflow/service
      - name: Execute software and isolation checks with the immutable local image
        run: |
          GNOMON_TEST_SOFTWARE_IMAGE=$(docker image inspect gnomon-bench-software:ci --format '{{.Id}}')
          export GNOMON_TEST_SOFTWARE_IMAGE
          GNOMON_TEST_SERVICE_IMAGE=$(docker image inspect gnomon-bench-service:ci --format '{{.Id}}')
          export GNOMON_TEST_SERVICE_IMAGE
          pytest -q benchmarks/tests/test_software_backend.py benchmarks/tests/test_service_backend.py benchmarks/tests/test_workflow_episodes.py benchmarks/tests/test_workflow_cohort.py

  package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install --upgrade build
      - name: Lint Bash installer
        run: shellcheck install.sh
      - name: Build distributions
        run: python -m build
      - name: Build the user-owned provider example separately
        run: python -m build --wheel --outdir example-dist examples/provider_plugin
      - name: Enforce distribution boundary
        run: |
          python - <<'PY'
          import pathlib, zipfile
          files = list(pathlib.Path("dist").iterdir())
          assert files and all(path.stat().st_size < 5_000_000 for path in files), files
          wheel = next(path for path in files if path.suffix == ".whl")
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert any(name.endswith("share/gnomon/skills/use-gnomon/SKILL.md") for name in names)
          PY
      - name: Prove clean-wheel operation without network
        run: |
          docker run --rm --network none \
            --volume "$PWD:/work:ro" --workdir /work python:3.12-slim \
            python scripts/offline_wheel_smoke.py dist/*.whl --example-wheel example-dist/*.whl
      - name: Install wheel
        run: |
          START=$SECONDS
          python -m pip install dist/*.whl
          gnomon capabilities >/dev/null
          ELAPSED=$((SECONDS - START))
          echo "Fresh wheel install to first trusted runtime response: ${ELAPSED}s"
          test "$ELAPSED" -lt 60
      - name: Smoke-test installed CLI
        run: |
          cd "$(mktemp -d)"
          gnomon capabilities
          gnomon --version
          printf 'timestamp,value\n2026-01-01,1\n2026-01-02,2\n' | gnomon inspect - --time-column timestamp --target-column value --frequency D
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
