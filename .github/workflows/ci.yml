name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Check proven code-hygiene defects
        run: ruff check src/gnomon
      - name: Run tests
        run: pytest -q
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Validate benchmark configs
        # The adapters' own tests run above (testpaths includes
        # benchmarks/tests); this additionally proves every shipped config
        # still expands to a runnable command line, which is where the
        # suite silently rots — no datasets, no API keys, no LLM calls.
        run: |
          python -m pip install pyyaml
          for config in benchmarks/configs/*.yaml; do
            # Skip reference data (published_reference.yaml) — only
            # configs that declare runs describe a batch to validate.
            grep -q '^runs:' "$config" || continue
            echo "== $config"
            python -m benchmarks.run_all --config "$config" --dry-run
          done

  package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install --upgrade build
      - name: Lint Bash installer
        run: shellcheck install.sh
      - name: Build distributions
        run: python -m build
      - name: Enforce distribution boundary
        run: |
          python - <<'PY'
          import pathlib, zipfile
          files = list(pathlib.Path("dist").iterdir())
          assert files and all(path.stat().st_size < 5_000_000 for path in files), files
          wheel = next(path for path in files if path.suffix == ".whl")
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert any(name.endswith("share/gnomon/skills/use-gnomon/SKILL.md") for name in names)
          PY
      - name: Install wheel
        run: |
          START=$SECONDS
          python -m pip install dist/*.whl
          gnomon capabilities >/dev/null
          ELAPSED=$((SECONDS - START))
          echo "Fresh wheel install to first trusted runtime response: ${ELAPSED}s"
          test "$ELAPSED" -lt 60
      - name: Smoke-test installed CLI
        run: |
          cd "$(mktemp -d)"
          gnomon capabilities
          gnomon --version
          printf 'timestamp,value\n2026-01-01,1\n2026-01-02,2\n' | gnomon inspect - --time timestamp --target value --frequency D
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
