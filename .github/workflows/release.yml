name: Release to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(PYTHONPATH=src python -c 'from gnomon.product_contract import __version__; print(__version__)')"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
          python - <<'PY'
          import pathlib, zipfile
          files = list(pathlib.Path("dist").iterdir())
          assert files and all(path.stat().st_size < 5_000_000 for path in files), files
          wheel = next(path for path in files if path.suffix == ".whl")
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert any(name.endswith("share/gnomon/skills/use-gnomon/SKILL.md") for name in names)
          PY
      - name: Prove clean-wheel operation without network
        run: |
          docker run --rm --network none \
            --volume "$PWD:/work:ro" --workdir /work python:3.12-slim \
            python scripts/offline_wheel_smoke.py dist/*.whl
      - name: Verify wheel installation
        env:
          GNOMON_REGISTRY_PATH: ${{ runner.temp }}/gnomon-release-registry.sqlite
        run: |
          python -m pip install dist/*.whl
          gnomon capabilities
          TMPDIR="$(mktemp -d)"
          cd "$TMPDIR"
          gnomon track report --project release-smoke --output report
          test -s report/report.md
          test -s report/report.html
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import re, os, pathlib
          version = os.environ["RELEASE_TAG"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## {re.escape(version)}[^\n]*\n(.*?)(?=^## |\Z)",
              text, re.M | re.S,
          )
          notes = (match.group(1).strip() + "\n") if match else "See CHANGELOG.md.\n"
          pathlib.Path("release-notes.md").write_text(notes, encoding="utf-8")
          EOF
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            --verify-tag

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gnomon-forecast/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@release/v1
