name: Bug report
description: Something produced a wrong result, a crash, or an unhelpful error
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Aion's structured outputs make bugs unusually reproducible — the three
        fields below are usually everything needed. Agents can gather all of
        them automatically; see "Reporting issues" in the skill/docs.
  - type: textarea
    id: command
    attributes:
      label: Exact command or tool call
      description: The CLI command, or the MCP tool name and JSON arguments.
      placeholder: aion forecast data.csv --time timestamp --target value --horizon 7 --repair aggressive
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full error envelope or artifact.json
      description: |
        On error: the complete JSON error (it includes code, details, and
        repair_options). On a wrong result: the artifact.json from the run's
        artifact directory (it contains the evidence needed to reproduce).
      render: json
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Output of `aion capabilities`
      description: Reports the runtime version, Python, and installed extras.
      render: json
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Input data (optional)
      description: |
        A minimal sample of the input that triggers the issue, if it can be
        shared. If not, the `data_quality` section of `aion inspect` output
        is the next best thing.
