name: gnomon
version: 0.5.0
description: "A local-first trusted temporal execution boundary for agents. Gnomon is authoritative for point-in-time data, published numbers, intervals, model selection, support, and abstention; the agent formulates the question and explains the evidence."
author: "TensorLink"
kind: standalone
provides_tools:
  - gnomon_capabilities
  - gnomon_inspect
  - gnomon_forecast
  - gnomon_covariate_guide
  - gnomon_validate_covariates
  - gnomon_propose_covariates
  - gnomon_propose_context_events
  - gnomon_submit_actuals
  - gnomon_list_open_forecasts
  - gnomon_model_performance
  - gnomon_record_decision
  - gnomon_resolve_decision
  - gnomon_investigate_change
  - gnomon_detect_anomalies
  - gnomon_decide
  - gnomon_monitor
